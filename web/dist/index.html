<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nandbox</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%230b0f17%22/%3E%3Ctext x=%228%22 y=%2212.5%22 font-size=%2212%22 text-anchor=%22middle%22 fill=%22%233dffa0%22%3E%E2%8A%BC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand"><span class="logo">⊼</span> nandbox</div>
    <nav id="crumbs"></nav>
    <div class="spacer"></div>
    <div class="controls">
      <button id="run">▶ Run</button>
      <button id="step" title="One clock cycle">Step</button>
      <input id="speed" type="range" min="0" max="6.7" step="0.05" value="4.78" title="Clock speed (log scale)">
      <span id="hz" class="mono"></span>
      <button id="undo" title="Undo (Ctrl+Z)">↶</button>
      <button id="redo" title="Redo (Ctrl+Shift+Z)">↷</button>
      <button id="fit" title="Fit view">⤢</button>
      <button id="share" class="accent">Share</button>
      <div id="peers"></div>
    </div>
  </header>
  <main>
    <aside id="palette"></aside>
    <section id="stage">
      <canvas id="canvas"></canvas>
      <div id="hint">drag to pan · shift-drag to select · wheel to zoom · double-click a chip to dive in · Esc goes up · drag pin → pin to wire · Ctrl+C/V/Z · arrows/WASD steer</div>
      <div id="error" hidden></div>
      <div id="toast" hidden></div>
      <div id="status"></div>
    </section>
    <aside id="dock">
      <canvas id="screen" width="256" height="256"></canvas>
      <div class="row">
        <canvas id="score" width="76" height="56"></canvas>
        <div class="pad">
          <span></span><button id="j-up">▲</button><span></span>
          <button id="j-left">◀</button><span></span><button id="j-right">▶</button>
          <span></span><button id="j-down">▼</button><span></span>
        </div>
      </div>
      <div id="leds"></div>
      <div id="ir" class="mono"></div>
      <div id="stats" class="mono"></div>
    </aside>
  </main>
  <script src="/app.js"></script>
</body>
</html>
